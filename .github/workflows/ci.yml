name: ci

# Prose-only changes skip it. The guides page builds docs/*.md, but cmark takes any text;
# a new guide also touches guides.nix, which still runs the check.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

# A newer push to the same branch makes the running check moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix fmt -- --ci

  # Both hosts are aarch64-linux, so the arm runner builds them natively.
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      # The closure unpacks to ~25 GiB, more than the runner leaves free. These are
      # toolchains no Nix build uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Pulls what earlier runs built, and pushes what this one builds as it goes (the daemon
      # pushes only local builds, not what came from cache.nixos.org), so a cancelled run's
      # work still lands.
      - uses: cachix/cachix-action@v16
        with:
          name: lattice
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: scripts/ci-build.sh
