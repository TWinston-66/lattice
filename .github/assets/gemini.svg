<?xml version="1.0" encoding="UTF-8"?>
<!--
  A stand-in mark for the Gemini web app, drawn here rather than vendored: Google ships
  no redistributable SVG, and Papirus's gemini.svg is Calligra Gemini, a KDE office app.
  This is the four-pointed sparkle in Gemini's blue-to-purple, which is the part that
  reads at 24px in the launcher. It is not the official asset. Drop the real one in at
  this path if it ever becomes available; nothing else has to change.

  Deliberately not run through theme.recolourSvg: an app icon should keep the app's own
  colours, so this one does not follow a re-accent the way lattice's own logo does.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="gemini" x1="4" y1="44" x2="44" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c69ff"/>
      <stop offset="0.5" stop-color="#7d5bff"/>
      <stop offset="1" stop-color="#b44bff"/>
    </linearGradient>
  </defs>
  <path fill="url(#gemini)"
        d="M24 2 C24 14 34 24 46 24 C34 24 24 34 24 46 C24 34 14 24 2 24 C14 24 24 14 24 2 Z"/>
</svg>
