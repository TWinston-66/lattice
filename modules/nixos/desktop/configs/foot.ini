# foot, lattice's terminal: a window for tmux, which does the tabs, splits and scrollback,
# so this is mostly how it draws. /etc/xdg/foot/foot.ini; a ~/.config/foot/foot.ini
# replaces it whole rather than adding to it.

# The first window attaches to main, the session the tmux user unit started with the
# desktop (desktop/session.nix); each one opened while main is on screen gets a session of
# its own that ends with the window (lattice-tmux-attach, configs.nix). A window closes
# when its tmux client does. A foot given a command to run -- `foot htop`, rofi's
# run-shell-command -- skips this and runs it bare. The shell inside is $SHELL, which is
# what tmux runs unless told otherwise.
shell=@tmuxAttach@

# The colours lattice-theme has picked. foot reads them once, at launch; lattice-palette
# recolours the windows already open with escape codes.
include=~/.cache/lattice/theme.foot

# Ghostty's column width, measured: JetBrains Mono at 8.4pt against the 96 DPI convention,
# scaled by each output (foot's default, dpi-aware=no). The Nerd Font build, and the font's
# own line height, because foot draws powerline glyphs at the font's size rather than
# stretching them to the cell the way Ghostty does. From the symbols-only fallback the tmux
# bar's round caps came out short of the row and its icons cramped, and with Ghostty's extra
# 10% of line-height they stopped 2px short of the block they cap.
font=JetBrainsMono Nerd Font:size=8.4
pad=8x6 center

[scrollback]
# tmux keeps the history; this is only for the moments before it attaches.
lines=1000
# multiplier is left at its default of 3: the trackpad's speed in foot comes from a window
# rule in hyprland.lua, and inside tmux, which takes the mouse, foot leaves the wheel
# unscaled anyway -- tmux.conf's wheel bindings set the speed there.

[mouse]
hide-when-typing=yes

[cursor]
style=beam
blink=no

[text-bindings]
# Super+A and Super+Y send what cmd+a and cmd+y do in the Ghostty config this was matched
# to on macOS: the tmux prefix (C-a) and C-y.
\x01=Mod4+a
\x19=Mod4+y
