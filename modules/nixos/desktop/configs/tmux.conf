# lattice's tmux: the tabs, splits and scrollback for foot, which starts it (foot.ini). It
# is /etc/tmux.conf, so tmux reads it first and ~/.config/tmux/tmux.conf after it, for
# anything a user wants on top. The plugins are store paths, put in by configs.nix where
# this says @plugin@ -- there is no TPM, and nothing is cloned into the home.

bind -N "Reload tmux config" r source-file /etc/tmux.conf \; source-file -q ~/.config/tmux/tmux.conf \; display "reloaded"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:usstyle:extkeys:hyperlinks:sync:clipboard"
set -as terminal-features ",foot*:RGB:usstyle:extkeys:hyperlinks:sync:clipboard"

set -s escape-time 10
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g allow-passthrough all
set -g focus-events on
set -s extended-keys on
set -g extended-keys-format csi-u
setw -g aggressive-resize on
set -g status-interval 5

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g set-titles on
set -g set-titles-string "#S: #{b:pane_current_path}"

set -g set-clipboard on
# The mouse only selects; nothing is copied until it is asked for, with y, Enter or a right
# click, which then leave copy mode. A drag left alone stays selected, and a click clears it.
unbind -T copy-mode MouseDragEnd1Pane
bind -T copy-mode DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode TripleClick1Pane select-pane \; send -X select-line
bind -T root DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-word }
bind -T root TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-line }
bind -T copy-mode y send -X copy-pipe-and-cancel
bind -T copy-mode Enter send -X copy-pipe-and-cancel
bind -T copy-mode MouseDown3Pane if -F "#{selection_present}" { send -X copy-pipe-and-cancel }
# foot hands the wheel to tmux one event per line scrolled, without its own multiplier
# (foot.ini), so this is the scroll speed in copy mode: 6 lines an event. Programs that take
# the mouse themselves (nvim, Claude Code) get each event once, as is: one line a step is
# what keeps them smooth, and the trackpad's speed in foot is set in hyprland.lua instead.
bind -T copy-mode WheelUpPane select-pane \; send -X -N 6 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send -X -N 6 scroll-down

unbind %
unbind '"'
bind -N "Split side by side" '\' split-window -h -c "#{pane_current_path}"
bind -N "Split top and bottom" - split-window -v -c "#{pane_current_path}"
bind -N "New window" c new-window -c "#{pane_current_path}"

bind -N "Session picker (sesh)" o display-popup -h 60% -w 60% -E "sesh picker -i"

# Popups over the layout, in the pane's directory. The scratch shell is a session of its
# own, so what runs in it is still there the next time; the same key from inside closes it.
bind -N "Scratch shell popup (toggle)" ` if -F "#{==:#{session_name},scratch}" { detach-client } {
  display-popup -E -w 80% -h 75% -d "#{pane_current_path}" "env -u TMUX tmux new -A -s scratch \\; set -t scratch status off"
}
# Through an interactive zsh, as from a prompt: /etc/zshrc is what points lazygit
# (LG_CONFIG_FILE) and btop (its alias) at the live theme, and a popup's own shell is not
# interactive, so it never reads it.
bind -N "lazygit popup" g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "zsh -ic lazygit"
bind -N "btop popup" t display-popup -E -w 90% -h 90% "zsh -ic btop"
set -g detach-on-destroy off

# The server outlives the compositor, and often starts before it: panes otherwise miss
# HYPRLAND_INSTANCE_SIGNATURE entirely, or keep a stale one across a Hyprland restart, and
# hyprctl then fails with "HYPRLAND_INSTANCE_SIGNATURE not set!". Refreshed from the
# attaching client, so new panes get whichever instance is live.
set -ga update-environment HYPRLAND_INSTANCE_SIGNATURE

set-environment -g TMUX_FZF_LAUNCH_KEY "f"
set-environment -g TMUX_FZF_OPTIONS "-p -w 60% -h 60% -m"

set -g @catppuccin_flavor 'mocha'

set -g @catppuccin_status_background 'none'

set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_status_right_separator ' '

set -g @catppuccin_window_status_style 'rounded'

# The session pill shows what the keys will do: red with the prefix down, yellow in copy
# mode, mauve with the pane zoomed, green otherwise.
set -g @catppuccin_session_color "#{?client_prefix,#{E:@thm_red},#{?pane_in_mode,#{E:@thm_yellow},#{?window_zoomed_flag,#{E:@thm_mauve},#{E:@thm_green}}}}"
set -g @catppuccin_session_icon "#{?client_prefix,󰌌 ,#{?pane_in_mode,󰆏 ,#{?window_zoomed_flag,󰁌 , }}}"
set -g @catppuccin_session_text " #S#{?pane_in_mode, · copy,}#{?window_zoomed_flag, · zoom,}"
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text ' #{?#{==:#W,zsh},#{b:pane_current_path},#W}'
set -g @catppuccin_window_current_text ' #{?#{==:#W,zsh},#{b:pane_current_path},#W}'

set -g @cpu_medium_thresh 40
set -g @cpu_high_thresh 80
set -g @ram_medium_thresh 60
set -g @ram_high_thresh 85
set -g @cpu_medium_fg_color "#{E:@thm_crust}"
set -g @cpu_medium_bg_color "#{E:@thm_yellow}"
set -g @ram_medium_fg_color "#{E:@thm_crust}"
set -g @ram_medium_bg_color "#{E:@thm_yellow}"

# The flavour lattice-theme has picked, as the plugin's own @thm_* colours. Set plainly here,
# they win over the plugin's flavour file, which only sets each one if it is unset. Switching
# re-sources this whole file (lattice-palette), since the plugin bakes the colours into the
# status formats as it loads. -q because there is no such file until the first pick.
source-file -q ~/.cache/lattice/theme.tmux

run "@catppuccin@"

# Panes without focus sit on the darker mantle, so the one being typed into stands out
# when a window is split. Programs that paint their own background (nvim) keep it.
set -gF window-style "bg=#{@thm_mantle}"
# terminal, not default: default in window-active-style inherits window-style, which made
# the focused pane mantle too, a shade off foot's own background around it.
set -g window-active-style "bg=terminal"

set -g status-position bottom
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200

set -g window-status-separator ' '

set -g status-left '#{E:@catppuccin_status_session}'

set -gF  status-right '#{@catppuccin_status_gitmux}'
set -agF status-right '#{E:@catppuccin_status_cpu}'
set -agF status-right '#{E:@catppuccin_status_ram}'

set -g @continuum-restore 'on'
set -g @continuum-boot 'off'
set -g @resurrect-capture-pane-contents 'on'
# Sessions that die with their foot window (configs.nix) are left out of every save.
set -g @resurrect-hook-post-save-layout '@resurrectDrop@'

# which-key builds its menu from a YAML file at load, into its own directory by default --
# a store path here, so it is pointed at the home instead: the menu's config.yaml lands in
# ~/.config/lattice/tmux-which-key, seeded from the example the first time, and edits to
# it take on the next reload.
set -g @tmux-which-key-xdg-enable 1
set -g @tmux-which-key-xdg-plugin-path "lattice/tmux-which-key"

run "@resurrect@"
run "@continuum@"
run "@tmuxFzf@"
run "@whichKey@"
run "@cpu@"

set -g @catppuccin_gitmux_text ' #(o=$(gitmux -cfg /etc/xdg/gitmux/gitmux.conf "#{pane_current_path}" 2>/dev/null); [ -n "$o" ] && echo "$o" || echo "no repo")'

set -gF  window-status-format "#[fg=#{@catppuccin_window_text_color},bg=default]"
set -agF window-status-format "#[fg=#{@thm_fg},bg=#{@catppuccin_window_text_color}]#{@catppuccin_window_text} "
set -agF window-status-format "#[fg=#{@thm_crust},bg=#{@catppuccin_window_number_color}] #{@catppuccin_window_number}"
set -agF window-status-format "#[fg=#{@catppuccin_window_number_color},bg=default]#[none]"

set -gF  window-status-current-format "#[fg=#{@catppuccin_window_current_text_color},bg=default]"
set -agF window-status-current-format "#[fg=#{@thm_fg},bg=#{@catppuccin_window_current_text_color}]#{@catppuccin_window_current_text} "
set -agF window-status-current-format "#[fg=#{@thm_crust},bg=#{@catppuccin_window_current_number_color}] #{@catppuccin_window_current_number}"
set -agF window-status-current-format "#[fg=#{@catppuccin_window_current_number_color},bg=default]#[none]"
